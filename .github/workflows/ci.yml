name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc-x64:
    name: Windows x64 MSVC — v1 release gate
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: .\scripts\configure.ps1

      - name: Build Debug
        shell: pwsh
        run: .\scripts\build.ps1 -Configuration Debug

      - name: Test Debug
        shell: pwsh
        run: .\scripts\test.ps1 -Configuration Debug

      - name: Smoke Debug window lifecycle
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\build\Debug\FAULTMINE.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Debug FAULTMINE smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Build Release
        shell: pwsh
        run: .\scripts\build.ps1 -Configuration Release

      - name: Test Release
        shell: pwsh
        run: .\scripts\test.ps1 -Configuration Release

      - name: Smoke Release window lifecycle
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\build\Release\FAULTMINE.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Release FAULTMINE smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Measure and enforce v1 performance budgets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & .\build\Release\FAULTMINE-perf.exe | Tee-Object -FilePath .\artifacts\performance.json
          if ($LASTEXITCODE -ne 0) {
            throw "FAULTMINE performance budget probe failed with exit code $LASTEXITCODE."
          }

      - name: Build portable package
        shell: pwsh
        run: .\scripts\package.ps1 -Configuration Release -OutputDir artifacts

      - name: Verify clean extracted package
        shell: pwsh
        run: .\scripts\verify-package.ps1 -ArchivePath .\artifacts\FAULTMINE-1.0.0-win64.zip

      - name: Upload v1 release-candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: FAULTMINE-1.0.0-win64-release-candidate
          path: |
            artifacts/FAULTMINE-1.0.0-win64.zip
            artifacts/performance.json
          if-no-files-found: error
          retention-days: 30
