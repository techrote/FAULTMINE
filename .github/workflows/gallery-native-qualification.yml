name: Pinned gallery native qualification
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/gallery-native-qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-gallery:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Preserve exact authored LF bytes on Windows (no Git CRLF smudging)
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: engine
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: techrote/FAULTMINE
          ref: 890a880d47a0d09cb32be38b16a5db1b3e5a246d
          path: candidate-temporal
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: techrote/FAULTMINE
          ref: dfa56dc418b55cf4e461bdd2c7556c0874cc65e5
          path: candidate-original
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: techrote/FAULTMINE
          ref: 53d9060246e024cb2efcd8ac13e2caf31e59e80f
          path: candidate-evolution
          persist-credentials: false
      - name: Check source ancestry and pinned authors
        shell: pwsh
        run: |
          $heads = @{
            'candidate-temporal' = '890a880d47a0d09cb32be38b16a5db1b3e5a246d'
            'candidate-original' = 'dfa56dc418b55cf4e461bdd2c7556c0874cc65e5'
            'candidate-evolution' = '53d9060246e024cb2efcd8ac13e2caf31e59e80f'
          }
          foreach ($item in $heads.GetEnumerator()) {
            $actual = (& git -C $item.Key rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -cne $item.Value) { throw "Candidate moved: $($item.Key) = $actual" }
          }
          & git -C engine merge-base --is-ancestor 6c56b6543f9cda5330408d05eaf47da03485a94f HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Missing accepted canonical renderer #36 ancestry' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent author source/genome/project verification
        shell: pwsh
        run: |
          python .\candidate-temporal\gallery\temporal\01-signal-mausoleum\verify_artwork.py
          if ($LASTEXITCODE -ne 0) { throw 'Temporal author validator failed' }
          python .\candidate-original\gallery\originals\01-moth-rom\verify_artwork.py
          if ($LASTEXITCODE -ne 0) { throw 'Original author validator failed' }
          python -m py_compile .\candidate-evolution\gallery\evolution\01-aperture-ossuary\qualify-results.py
          if ($LASTEXITCODE -ne 0) { throw 'Evolution independent decoder not loadable' }
      - name: Configure Windows MSVC
        shell: pwsh
        working-directory: engine
        run: .\scripts\configure.ps1
      - name: Debug build, full test suite, and canonical replay negatives
        shell: pwsh
        working-directory: engine
        run: |
          .\scripts\build.ps1 -Configuration Debug
          if ($LASTEXITCODE -ne 0) { throw 'Debug build failed' }
          .\scripts\test.ps1 -Configuration Debug
          if ($LASTEXITCODE -ne 0) { throw 'Debug tests failed' }
          .\scripts\test-render-verify.ps1 -Configuration Debug
          if ($LASTEXITCODE -ne 0) { throw 'Debug replay tests failed' }
      - name: Release build, full test suite, and canonical replay negatives
        shell: pwsh
        working-directory: engine
        run: |
          .\scripts\build.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          .\scripts\test.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Release tests failed' }
          .\scripts\test-render-verify.ps1 -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Release replay tests failed' }
      - name: Measure performance, package and exercise extracted portable build
        id: package
        shell: pwsh
        working-directory: engine
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & .\build\Release\FAULTMINE-perf.exe | Tee-Object -FilePath .\artifacts\performance.json
          if ($LASTEXITCODE -ne 0) { throw 'Performance ceiling failed' }
          .\scripts\package.ps1 -Configuration Release -OutputDir artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
          .\scripts\verify-package.ps1 -ArchivePath .\artifacts\FAULTMINE-1.0.0-win64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Extracted portable qualification failed' }
      - name: Temporal — independent 32-frame CPU replay and cross-configuration proof
        id: temporal
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = $env:GITHUB_WORKSPACE
          $folder = Join-Path $root 'candidate-temporal\gallery\temporal\01-signal-mausoleum'
          $out = Join-Path $root 'evidence\temporal'
          if (Test-Path -LiteralPath $out) { throw 'Temporal evidence destination must be new; no overwrites' }
          New-Item -ItemType Directory -Force $out | Out-Null
          $release = Join-Path $root 'engine\build\Release\FAULTMINE-render.exe'
          $debug = Join-Path $root 'engine\build\Debug\FAULTMINE-render.exe'
          $source = Join-Path $folder 'source.bmp'
          $genome = Join-Path $folder 'genome.json'
          $sourceId = '03502053b9d752dd2db92329108c2d1ed1c769e00db8a08f6ce7b9331992dc75'
          if ((Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant() -cne
              'cbb58573b44b78a7a162289ede71eb541689d078b795960d0504888e3a8090de' -or
              (Get-FileHash -LiteralPath $genome -Algorithm SHA256).Hash.ToLowerInvariant() -cne
              'ac6651f58f3ee3b40d3852c6fa9a1435e5de2e6341cd7f5f894306d52695462c') {
            throw 'Submitted temporal inputs do not match author source/genome identities'
          }
          $records = @()
          for ($frame = 0; $frame -lt 32; $frame++) {
            $filename = ('residual-carrier_{0:D6}.png' -f $frame)
            $png = Join-Path $out $filename
            $lines = @(& $release --frame "$frame" $source $genome $png)
            $exit = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            $ids = @($lines | Where-Object { $_ -cmatch '^output_identity=[0-9a-f]{64}$' })
            if ($exit -ne 0 -or -not (Test-Path -LiteralPath $png) -or
                $lines -cnotcontains "frame=$frame" -or
                $lines -cnotcontains "source_identity=$sourceId" -or $ids.Count -ne 1) {
              throw "Native canonical render failed or identities missing at explicit frame $frame"
            }
            $records += [ordered]@{
              frame = $frame
              file = $filename
              canonical_output_identity = $ids[0].Substring(16)
              encoded_png_sha256 = (Get-FileHash -LiteralPath $png -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            Write-Host "Native canonical frame $frame identity $($ids[0])"
          }
          if ($records[0].canonical_output_identity -ceq $records[31].canonical_output_identity) {
            throw 'Expected temporal variation missing: first and last frames are identical'
          }
          foreach ($frame in @(31,0,24,8,16)) {
            $r = $records[$frame]
            $png = Join-Path $out $r.file
            foreach ($exe in @($release,$debug)) {
              $lines = @(& $exe --verify --frame "$frame" $source $genome $png)
              $exit = $LASTEXITCODE
              $global:LASTEXITCODE = 0
              if ($exit -ne 0 -or $lines -cnotcontains 'verification=passed' -or
                  $lines -cnotcontains "frame=$frame" -or
                  $lines -cnotcontains "output_identity=$($r.canonical_output_identity)") {
                throw "Canonical decoded RGBA8 cross-configuration replay mismatch frame=$frame"
              }
            }
            if ((Get-FileHash -LiteralPath $png -Algorithm SHA256).Hash.ToLowerInvariant() -cne $r.encoded_png_sha256) {
              throw "Read-only native replay modified temporal PNG at frame $frame"
            }
          }
          $audit = [ordered]@{
            audit_version = 1
            kind = 'integration-independent-native-cli-replay'
            fm012_gui_manifest = $false
            complete = $true
            candidate_head_sha = '890a880d47a0d09cb32be38b16a5db1b3e5a246d'
            source_identity = $sourceId
            genome_identity = 'ac6651f58f3ee3b40d3852c6fa9a1435e5de2e6341cd7f5f894306d52695462c'
            root_seed = 'a1b2c3d4e5f60718'
            frame_begin = 0
            frame_end_exclusive = 32
            semantic_rate = '12/1'
            frames = $records
            verified_release_and_debug_out_of_order = @(31,0,24,8,16)
            gui_sequence_export_and_cancel_pending = $true
            human_visual_acceptance_pending = $true
          }
          [IO.File]::WriteAllText((Join-Path $out 'integration-native-cli-audit.json'),
            ($audit | ConvertTo-Json -Depth 8) + [char]10, [Text.UTF8Encoding]::new($false))
          Write-Host 'PASS: real 32-frame temporal CPU outputs and ten exact decoded Release/Debug replays.'
      - name: Temporal author driver — execute repaired exact-head Windows replay
        id: temporal-author
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $driver = Join-Path $root 'candidate-temporal\gallery\temporal\01-signal-mausoleum\render-sequence-win.ps1'
          $renderer = Join-Path $root 'engine\build\Release\FAULTMINE-render.exe'
          $output = Join-Path $root 'evidence\temporal-author'
          & $driver -Configuration Release -RendererPath $renderer -OutputDirectory $output
          $audit = Get-Content -LiteralPath (Join-Path $output 'native-cli-replay-audit.json') -Raw | ConvertFrom-Json
          if (-not $audit.complete -or $audit.frames.Count -ne 32 -or
              @($audit.verified_out_of_order).Count -ne 5 -or $audit.is_fm012_export_manifest) {
            throw 'Repaired authored temporal driver did not create 32 canonical frames and its honest read-only audit.'
          }
          Write-Host 'PASS: latest author PowerShell driver executed on Windows, 32 real frames and five read-only replays.'
      - name: Original — canonical still and read-only Debug/Release replay
        id: original
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $folder = Join-Path $root 'candidate-original\gallery\originals\01-moth-rom'
          $out = Join-Path $root 'evidence\original'
          New-Item -ItemType Directory -Force $out | Out-Null
          $source = Join-Path $folder 'source.bmp'
          $genome = Join-Path $folder 'genome.json'
          $png = Join-Path $out 'moth-rom-canonical.png'
          $release = Join-Path $root 'engine\build\Release\FAULTMINE-render.exe'
          $debug = Join-Path $root 'engine\build\Debug\FAULTMINE-render.exe'
          $render = @(& $release --frame 0 $source $genome $png)
          $exit = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($exit -ne 0 -or -not (Test-Path $png)) { throw 'Native canonical original failed to render' }
          if ($render -cnotcontains 'source_identity=49aca43e0330c82dec3d579f42f6cca3728603e5155cec434bf0ee81303fff4e') {
            throw 'Native original source ID differs from author claim'
          }
          $identity = @($render | Where-Object { $_ -cmatch '^output_identity=[0-9a-f]{64}$' })
          if ($identity.Count -ne 1) { throw 'Native renderer failed to report original output identity' }
          $bytes = (Get-FileHash -LiteralPath $png -Algorithm SHA256).Hash
          foreach ($exe in @($release,$debug)) {
            $check = @(& $exe --verify --frame 0 $source $genome $png)
            $code = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            if ($code -ne 0 -or $check -cnotcontains 'verification=passed' -or
                $check -cnotcontains $identity[0]) { throw "Native original replay mismatch for $exe" }
          }
          if ((Get-FileHash -LiteralPath $png -Algorithm SHA256).Hash -cne $bytes) {
            throw 'Native verifier altered the canonical image'
          }
          $audit = @{
            native_canonical = $true
            candidate_sha = 'dfa56dc418b55cf4e461bdd2c7556c0874cc65e5'
            source_identity = '49aca43e0330c82dec3d579f42f6cca3728603e5155cec434bf0ee81303fff4e'
            genome_identity = 'fa4fda19e0701619a57b2c3eb0ee422ebf8f9f6911537ccc9ee912c125bf72e4'
            seed = '0d07c1cada55e7a1'
            frame = 0
            output_identity = $identity[0].Substring(16)
            encoded_png_sha256 = $bytes.ToLowerInvariant()
            verified_with = @('Release','Debug')
            fm012_and_visual_acceptance_pending = $true
          }
          [IO.File]::WriteAllText((Join-Path $out 'native-canonical-audit.json'),
            ($audit | ConvertTo-Json -Depth 5) + [char]10, [Text.UTF8Encoding]::new($false))
          Write-Host "PASS: real canonical original $($identity[0]); Debug and Release decoded image equivalence."
      - name: Evolution — run 384-candidate native canonical mine and audit every cache image
        id: evolution
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $folder = Join-Path $root 'candidate-evolution\gallery\evolution\01-aperture-ossuary'
          $out = Join-Path $root 'evidence\evolution'
          $batch = Join-Path $root 'engine\build\Release\FAULTMINE-batch.exe'
          & (Join-Path $folder 'mine.ps1') -BinaryPath $batch -OutDir $out -Threads 4
          $code = $LASTEXITCODE
          $global:LASTEXITCODE = 0
          if ($code -ne 0) { throw 'Native batch failed' }
          python (Join-Path $folder 'qualify-results.py') $out --all
          if ($LASTEXITCODE -ne 0) { throw 'Independent PNG and manifest validation failed' }
          $global:LASTEXITCODE = 0
          Write-Host 'PASS: complete canonical quarry and independently decoded pixel evidence.'
      - name: Evolution curated #223 — verify committed indexed PNG via native WIC and resume
        id: evolution-curated
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $root = $env:GITHUB_WORKSPACE
          $folder = Join-Path $root 'candidate-evolution\gallery\evolution\01-aperture-ossuary'
          $curated = Join-Path $folder 'curated'
          $native = Join-Path $root 'evidence\evolution'
          $source = Join-Path $folder 'source.bmp'
          $genome = Join-Path $curated 'ossuary-transmission-223.genome.json'
          $png = Join-Path $curated 'ossuary-transmission-223.png'
          $expected = 'eb70ef28390a69e3e1087471d611b41c94239e4140313ca9b782abd073472c14'
          $beforePngSha = (Get-FileHash -LiteralPath $png -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = Join-Path $native 'batch.fmbatch.json'
          $before = @((Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json).candidates |
            ForEach-Object { "$($_.descendant_index):$($_.genome_identity):$($_.pixel_identity)" })
          python (Join-Path $curated 'verify_selection.py') --native-dir $native
          if ($LASTEXITCODE -ne 0) { throw 'Curated indexed still/manifest did not match native selection evidence' }
          $global:LASTEXITCODE = 0
          foreach ($configuration in @('Debug','Release')) {
            $renderer = Join-Path $root ("engine\build\" + $configuration + "\FAULTMINE-render.exe")
            $lines = @(& $renderer --verify --frame 0 $source $genome $png)
            $code = $LASTEXITCODE
            $global:LASTEXITCODE = 0
            if ($code -ne 0 -or $lines -cnotcontains 'verification=passed' -or
                $lines -cnotcontains "output_identity=$expected" -or
                $lines -cnotcontains 'frame=0') {
              throw "Committed indexed #223 PNG failed native $configuration exact decoded-RGBA8 replay: $($lines -join ' | ')"
            }
          }
          if ((Get-FileHash -LiteralPath $png -Algorithm SHA256).Hash.ToLowerInvariant() -cne $beforePngSha) {
            throw 'Native read-only WIC replay modified the archived indexed PNG'
          }
          & (Join-Path $folder 'mine.ps1') -BinaryPath (Join-Path $root 'engine\build\Release\FAULTMINE-batch.exe') -OutDir $native -Threads 2 -Resume
          if ($LASTEXITCODE -ne 0) { throw 'Different-thread native resume failed' }
          $global:LASTEXITCODE = 0
          $after = @((Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json).candidates |
            ForEach-Object { "$($_.descendant_index):$($_.genome_identity):$($_.pixel_identity)" })
          if (@(Compare-Object -ReferenceObject $before -DifferenceObject $after).Count -ne 0) {
            throw 'Native two-thread resume changed indexed genomes or canonical pixel identities'
          }
          python (Join-Path $folder 'qualify-results.py') $native --all
          if ($LASTEXITCODE -ne 0) { throw 'Post-resume canonical specimen archive failed independent validation' }
          Write-Host 'PASS: committed indexed #223 native WIC replay in Debug/Release, and 384-index two-thread resume invariance.'
      - name: Prepare standalone native Windows gallery evaluation ZIP
        id: bundle
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $base = Join-Path $root 'engine\artifacts\FAULTMINE-1.0.0-win64.zip'
          if (-not (Test-Path $base)) { Write-Host 'No qualified native archive available'; exit 0 }
          $stage = Join-Path $env:RUNNER_TEMP 'faultmine-gallery-eval'
          Expand-Archive -LiteralPath $base -DestinationPath $stage
          $app = Join-Path $stage 'FAULTMINE-1.0.0-win64'
          $items = @(
            @('original','candidate-original\gallery\originals\01-moth-rom','gallery\originals\01-moth-rom'),
            @('temporal','candidate-temporal\gallery\temporal\01-signal-mausoleum','gallery\temporal\01-signal-mausoleum'),
            @('evolution','candidate-evolution\gallery\evolution\01-aperture-ossuary','gallery\evolution\01-aperture-ossuary')
          )
          foreach ($item in $items) {
            $to = Join-Path $app $item[2]
            New-Item -ItemType Directory -Force $to | Out-Null
            Copy-Item (Join-Path $root ($item[1] + '\*')) $to -Recurse
            $evidence = Join-Path $root ('evidence\' + $item[0])
            if (Test-Path $evidence) {
              Copy-Item -LiteralPath $evidence -Destination (Join-Path $to 'canonical-evidence') -Recurse
            }
          }
          # Keep the portable evaluation gallery free of interpreter caches copied
          # from the independent Python verification steps.
          $galleryPath = Join-Path $app 'gallery'
          Get-ChildItem -LiteralPath $galleryPath -Directory -Recurse -Filter '__pycache__' |
            Remove-Item -Recurse -Force
          Get-ChildItem -LiteralPath $galleryPath -File -Recurse |
            Where-Object { $_.Extension -in @('.pyc','.pyo') } |
            Remove-Item -Force
          $debris = @(Get-ChildItem -LiteralPath $galleryPath -Recurse |
            Where-Object { $_.Name -eq '__pycache__' -or $_.Extension -in @('.pyc','.pyo') })
          if ($debris.Count -ne 0) { throw 'Gallery evaluation bundle contains Python cache debris' }
          $instructions = @'
          FAULTMINE GALLERY EVALUATION — NATIVE WINDOWS x64
          Run "Run FAULTMINE.cmd", then Ctrl+Shift+O and choose an artwork .fmproj.
          Browse original/temporal/evolution subfolders. Inspect canonical-evidence
          for real native output. This is an evaluation bundle, NOT an accepted gallery.
          Candidate heads: PR37 890a880d47a0d09cb32be38b16a5db1b3e5a246d
          PR38 dfa56dc418b55cf4e461bdd2c7556c0874cc65e5
          PR39 53d9060246e024cb2efcd8ac13e2caf31e59e80f
          Renderer base main 6c56b6543f9cda5330408d05eaf47da03485a94f.
          No FM-012 GUI animation/cancellation or human visual acceptance is claimed.
          Missing output means failed/unexecuted, not evidence of canonical success.
          '@
          [IO.File]::WriteAllText((Join-Path $app 'GALLERY-EVALUATION.txt'),
            $instructions, [Text.UTF8Encoding]::new($false))
          $destination = Join-Path $root 'evidence\FAULTMINE-gallery-evaluation-win64.zip'
          New-Item -ItemType Directory -Force (Split-Path $destination) | Out-Null
          Compress-Archive -LiteralPath $app -DestinationPath $destination -CompressionLevel Optimal
          Write-Host "Prepared Windows native gallery evaluation ZIP: $destination"
      - name: Upload exact-source Windows outputs, even when an individual gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FAULTMINE-gallery-native-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce every individual gate
        if: always()
        env:
          PACKAGE_STATUS: ${{ steps.package.outcome }}
          TEMPORAL_STATUS: ${{ steps.temporal.outcome }}
          ORIGINAL_STATUS: ${{ steps.original.outcome }}
          EVOLUTION_STATUS: ${{ steps.evolution.outcome }}
          TEMPORAL_AUTHOR_STATUS: ${{ steps.temporal-author.outcome }}
          CURATED_STATUS: ${{ steps.evolution-curated.outcome }}
        shell: pwsh
        run: |
          Write-Host "package=$env:PACKAGE_STATUS temporal=$env:TEMPORAL_STATUS temporal-author=$env:TEMPORAL_AUTHOR_STATUS original=$env:ORIGINAL_STATUS evolution=$env:EVOLUTION_STATUS curated=$env:CURATED_STATUS"
          if ($env:PACKAGE_STATUS -ne 'success' -or $env:TEMPORAL_STATUS -ne 'success' -or
              $env:ORIGINAL_STATUS -ne 'success' -or $env:EVOLUTION_STATUS -ne 'success' -or
              $env:TEMPORAL_AUTHOR_STATUS -ne 'success' -or $env:CURATED_STATUS -ne 'success') {
            throw 'One or more native gallery qualification gates are not green. Preserve drafts; inspect uploaded evidence.'
          }
